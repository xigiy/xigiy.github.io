<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zalith 键位工坊</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f13; color: #e8e8ed;
    display: flex; flex-direction: column;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  /* ============ 工具栏 ============ */
  .toolbar {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    background: #1a1a22; border-bottom: 1px solid #2a2a35; flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar h1 { font-size: 14px; font-weight: 600; color: #c8c8d4; white-space: nowrap; }
  .toolbar input {
    background: #24242e; border: 1px solid #35353f; color: #e8e8ed;
    padding: 5px 8px; border-radius: 5px; font-size: 12px; width: 100px;
  }
  .toolbar input#screenW, .toolbar input#screenH { width: 56px; }
  .toolbar .sep { width: 1px; height: 20px; background: #2a2a35; margin: 0 2px; }
  .toolbar button {
    background: #2d2d3a; border: 1px solid #3d3d4a; color: #e8e8ed;
    padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer;
    white-space: nowrap;
  }
  .toolbar button:hover { background: #3d3d4a; }
  .toolbar button.primary { background: #4a6cf7; border-color: #4a6cf7; color: #fff; }
  .toolbar button.primary:hover { background: #5b7cf8; }

  /* ============ 主布局 ============ */
  .main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

  /* 左右面板（桌面端）*/
  .side {
    width: 220px; background: #14141a; border-right: 1px solid #2a2a35;
    overflow-y: auto; padding: 10px; flex-shrink: 0;
  }
  .side.right { border-right: none; border-left: 1px solid #2a2a35; width: 260px; }
  .side h3 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    color: #6b6b7a; margin: 14px 0 6px 4px; font-weight: 600;
  }
  .side h3:first-child { margin-top: 2px; }

  /* 图层面板 */
  .layer-row {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 8px; border-radius: 5px; margin-bottom: 3px;
    background: #1a1a22; border: 1px solid #26262f; font-size: 12px;
    cursor: pointer; user-select: none;
  }
  .layer-row:hover { border-color: #3d3d4a; }
  .layer-row.active { background: #23233a; border-color: #4a6cf7; }
  .layer-row .layer-eye { cursor: pointer; width: 18px; text-align: center; }
  .layer-row .layer-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-row .layer-actions { display: flex; gap: 0; }
  .layer-row .layer-actions button {
    background: transparent; border: none; color: #77778a; cursor: pointer;
    font-size: 10px; padding: 2px 4px; border-radius: 3px;
  }
  .layer-row .layer-actions button:hover { color: #fff; background: #2e2e3a; }
  .add-layer-btn {
    width: 100%; background: #1e1e28; border: 1px dashed #3d3d4a;
    color: #8888a0; padding: 5px; border-radius: 5px; font-size: 11px;
    cursor: pointer; margin: 4px 0;
  }
  .add-layer-btn:hover { border-color: #4a6cf7; color: #4a6cf7; }

  /* 键位 chips */
  .key-chip {
    display: inline-block; background: #1e1e28; border: 1px solid #2e2e3a;
    color: #d0d0dc; padding: 4px 7px; border-radius: 4px; font-size: 11px;
    cursor: pointer; margin: 2px; font-family: "SF Mono", Consolas, monospace;
    transition: all 0.1s; user-select: none;
  }
  .key-chip:hover { background: #2a2a38; border-color: #4a6cf7; color: #fff; }
  .key-chip.mouse { border-color: #6b4a7a; color: #c9a0d4; }

  /* ============ 画布 ============ */
  .stage-wrap {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: #0a0a0e; position: relative;
    overflow: hidden; padding: 16px; min-width: 0;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .stage-wrap * { touch-action: none; }
  .stage-label {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: #4a4a58; white-space: nowrap; z-index: 5;
  }
  .stage {
    position: relative; background: #1c1c24; border: 1px solid #2e2e3a;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 0 1px #000, 0 6px 24px rgba(0,0,0,0.5);
    transform-origin: center center;
  }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 5% 5%;
  }

  .element-node {
    position: absolute; display: flex; align-items: center; justify-content: center;
    cursor: grab; user-select: none; text-align: center;
    line-height: 1.2; white-space: pre-line; overflow: hidden;
    transition: box-shadow 0.1s; font-family: "SF Mono", Consolas, monospace;
    word-break: break-all;
    touch-action: none;
  }
  .element-node:active { cursor: grabbing; }
  .element-node.selected { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #4a6cf7 !important; z-index: 10 !important; }
  .element-node.joystick { border-radius: 50%; }

  .element-node.default-style {
    background: rgba(100,100,100,0.7); color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .element-node.normal.toggleable { border: 1.5px dashed #fff; }
  .element-node.textbox.default-style {
    background: rgba(130,130,140,0.25); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px; color: #c8c8d4;
  }
  .joystick-base {
    width: 100%; height: 100%; border-radius: 50%;
    background: rgba(100,100,100,0.6); border: 2px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
  }
  .joystick-stick {
    width: 40%; height: 40%; border-radius: 50%;
    background: rgba(200,200,200,0.8);
  }

  /* 选中时浮现坐标标签 */
  .coord-badge {
    position: absolute; background: #4a6cf7; color: #fff;
    padding: 2px 6px; border-radius: 4px; font-size: 10px;
    white-space: nowrap; pointer-events: none; z-index: 20;
    transform: translate(-50%, -140%);
  }

  /* ============ 属性面板 ============ */
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; color: #8888a0; margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; background: #1e1e28; border: 1px solid #2e2e3a;
    color: #e8e8ed; padding: 6px 8px; border-radius: 5px; font-size: 12px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: none; border-color: #4a6cf7; }
  .field-row { display: flex; gap: 8px; }
  .field-row .field { flex: 1; }
  .field-hint { font-size: 10px; color: #5a5a68; margin-top: 3px; }
  .pct-row { display: flex; align-items: center; gap: 6px; }
  .pct-row input { flex: 1; }
  .pct-row span { width: 28px; text-align: right; font-size: 11px; color: #8888a0; }
  .empty-hint { color: #4a4a58; font-size: 12px; text-align: center; padding: 30px 10px; line-height: 1.6; }
  .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #c8c8d4; cursor: pointer; margin-bottom: 8px; }
  .toggle-row input { width: auto; }
  .delete-btn {
    background: #3a1a1a; border: 1px solid #6a2a2a; color: #e07070;
    padding: 7px; border-radius: 5px; cursor: pointer; width: 100%;
    font-size: 12px; margin-top: 10px;
  }
  .delete-btn:hover { background: #4a2020; }

  /* ============ 滑块 ============ */
  .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .slider-row input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; background: #2e2e3a; border-radius: 2px; outline: none;
    padding: 0; border: none;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #4a6cf7; cursor: pointer;
    border: 2px solid #fff; box-shadow: 0 0 4px rgba(74,108,247,0.6);
  }
  .slider-row input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: #4a6cf7; cursor: pointer; border: 2px solid #fff;
  }
  .slider-row input[type="number"] {
    width: 58px; flex: none; text-align: right; padding: 4px 6px;
  }
  .slider-row span.pct { width: 22px; text-align: left; font-size: 11px; color: #8888a0; }
  .slider-row span.val { min-width: 36px; text-align: right; font-size: 11px; color: #8888a0; font-family: monospace; }

  /* 网格开关 */
  .grid-overlay {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image:
      linear-gradient(rgba(74,108,247,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,108,247,0.15) 1px, transparent 1px);
  }

  /* 多按键 chip 列表 */
  .keylist { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
  .keychip {
    background: #2d2d3a; border: 1px solid #3d3d4a; color: #c8c8d4;
    padding: 2px 6px; border-radius: 3px; font-size: 10px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px; font-family: monospace;
  }
  .keychip:hover { background: #3d3d4a; }
  .keychip .remove { color: #e07070; font-size: 12px; }

  /* ============ 移动端底部 Tab ============ */
  .mobile-tabs { display: none; }

  /* ============ 模态 ============ */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #14141a; border: 1px solid #2e2e3a; border-radius: 10px;
    width: 80%; max-width: 720px; max-height: 85vh; display: flex;
    flex-direction: column; overflow: hidden;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid #2a2a35; flex-shrink: 0;
  }
  .modal-header span { font-size: 13px; font-weight: 600; }
  .modal-header button {
    background: #2d2d3a; border: 1px solid #3d3d4a; color: #e8e8ed;
    padding: 4px 12px; border-radius: 5px; cursor: pointer; font-size: 12px;
  }
  .modal-body { flex: 1; overflow: hidden; display: flex; min-height: 0; }
  .modal-textarea {
    flex: 1; background: #0f0f13; color: #a0d0a0; border: none;
    padding: 12px 14px; font-family: "SF Mono", Consolas, monospace;
    font-size: 11px; line-height: 1.5; resize: none; outline: none;
  }

  .status {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #1e1e28; border: 1px solid #3d3d4a; color: #c8c8d4;
    padding: 8px 16px; border-radius: 20px; font-size: 12px;
    opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 200;
    white-space: nowrap;
  }
  .status.show { opacity: 1; }

  /* ============ 响应式 ============ */
  @media (max-width: 720px) {
    body { overflow: hidden; }
    .toolbar input { display: none; }
    .toolbar input#screenW, .toolbar input#screenH { display: block; width: 38px; }
    .toolbar input#canvasScale { display: inline-block; width: 50px; }
    #scaleLabel { display: inline-block; font-size: 9px; width: 28px; }
    .toolbar h1 { font-size: 12px; }
    .toolbar button { padding: 3px 5px; font-size: 10px; }
    .main { flex-direction: column; }
    .side { display: none; width: 100% !important; max-height: 40vh; overflow-y: auto; border-right: none; border-left: none; border-top: 1px solid #2a2a35; }
    .side.active { display: block; }
    .stage-wrap { padding: 10px; flex: 1; min-height: 42vh; }
    .mobile-tabs {
      display: flex; flex-shrink: 0; background: #14141a;
      border-top: 1px solid #2a2a35;
    }
    .mobile-tabs .mtab {
      flex: 1; padding: 10px 0; text-align: center; font-size: 12px;
      color: #8888a0; cursor: pointer; border: none; background: none;
      border-top: 2px solid transparent;
    }
    .mobile-tabs .mtab.active { color: #4a6cf7; border-top-color: #4a6cf7; background: #1a1a22; }
    /* 横屏 → 桌面模式 */
    @media (orientation: landscape) {
      .toolbar button, .toolbar input#screenW, .toolbar input#screenH { padding: 5px 7px; font-size: 11px; }
      .stage-wrap { flex: 1; padding: 6px; }
      .side { max-height: 100vh; width: 200px !important; max-height: none; }
      .main { flex-direction: row; }
      .mobile-tabs { display: none; }
      #panelLeft, #panelRight { display: block; }
      #panelLeft.active, #panelRight.active { display: block; }
    }
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>⚡ 键位工坊</h1>
  <div class="sep"></div>
  <button onclick="undo()" id="btnUndo" title="撤销 (Ctrl+Z)" style="font-size:14px;padding:4px 8px">↶</button>
  <button onclick="redo()" id="btnRedo" title="重做 (Ctrl+Y)" style="font-size:14px;padding:4px 8px">↷</button>
  <button onclick="toggleGrid()" id="btnGrid" title="对齐网格 (G)" style="font-size:13px;padding:4px 8px">🔲</button>
  <div class="sep"></div>
  <button onclick="setPreset(1920,1080)" title="1080p" style="padding:4px 7px;font-size:10px">1080p</button>
  <button onclick="setPreset(2400,1080)" title="2K 手机横" style="padding:4px 7px;font-size:10px">2K横</button>
  <button onclick="setPreset(1080,1920)" title="手机竖屏" style="padding:4px 7px;font-size:10px">手机</button>
  <button onclick="swapScreenXY()" title="横竖屏切换" style="padding:4px 7px;font-size:11px">🔄</button>
  <div class="sep"></div>
  <input id="screenW" type="number" value="2400" title="屏幕宽" style="width:50px">
  <span style="font-size:11px;color:#6b6b7a">×</span>
  <input id="screenH" type="number" value="1080" title="屏幕高" style="width:50px">
  <input id="canvasScale" type="range" min="30" max="200" value="80" style="width:80px" title="画布缩放">
  <span id="scaleLabel" style="font-size:10px;color:#6b6b7a;width:32px">80%</span>
  <div class="sep"></div>
  <button onclick="addElement('normal')">🔘</button>
  <button onclick="addElement('joystick')">🕹</button>
  <button onclick="addElement('textbox')">📝</button>
  <div class="sep"></div>
  <button onclick="showImport()">📥</button>
  <button class="primary" onclick="exportJSON()">📤 下载</button>
</div>

<div class="main">
  <!-- 左侧：图层 + 键位库 -->
  <div class="side" id="panelLeft">
    <h3>图层</h3>
    <div id="layerPanel"></div>
    <button class="add-layer-btn" onclick="addLayerUI()">＋ 新建图层</button>
    <div id="keyChips" style="display:none"></div>
    <h3 style="display:inline-block;cursor:pointer" onclick="toggleKeyChips()">⌨ 键位库 <span id="kcToggle">▼</span></h3>
    <div id="keyChips2"></div>
  </div>

  <!-- 中间：画布 -->
  <div class="stage-wrap" id="stageWrap">
    <div class="stage-label" id="stageLabel"></div>
    <div class="stage" id="stage">
      <div class="grid-overlay" id="gridOverlay" style="display:none"></div>
    </div>
  </div>

  <!-- 右侧：属性 -->
  <div class="side right" id="panelRight"></div>
</div>

<!-- 移动端底部 Tab -->
<div class="mobile-tabs" id="mobileTabs">
  <button class="mtab" onclick="switchMobileTab('layers')">📚 图层</button>
  <button class="mtab" onclick="switchMobileTab('props')">⚙ 属性</button>
  <button class="mtab" onclick="switchMobileTab('keys')">⌨ 键位</button>
</div>

<!-- JSON 浮层 -->
<div class="modal-overlay" id="jsonOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <span id="jsonTitle">导出 JSON</span>
      <div style="display:flex;gap:8px">
        <button id="jsonActionBtn" onclick="copyJSON()">复制</button>
        <button onclick="closeJSON()">关闭</button>
      </div>
    </div>
    <textarea id="jsonArea" class="modal-textarea" spellcheck="false"></textarea>
  </div>
</div>

<div class="status" id="status"></div>

<script>
'use strict';

/* ============ 状态 ============ */
let layers = [];
let styles = [];
let activeLayerId = null;
let selectedId = null;
let nextElementId = 1;
let nextLayerId = 1;
let nextLayerSeq = 1;
let currentEditingStyleId = null;
let currentStyleTheme = 'darkStyle';
let currentMobileTab = 'props';

// 撤销/重做
let history = [];
let historyIndex = -1;
const HISTORY_MAX = 50;
// 网格
let gridEnabled = true;
let gridSizePx = 20;  // 20px 对齐

const stage = document.getElementById('stage');
const stageWrap = document.getElementById('stageWrap');
const rightPanel = document.getElementById('panelRight');
const screenWInput = document.getElementById('screenW');
const screenHInput = document.getElementById('screenH');

/* ============ 撤销/重做 ============ */
function snapshot() {
  const snap = JSON.stringify({ layers, styles, nextElementId, nextLayerId, nextLayerSeq });
  // 如果当前不是历史末尾，截断后面的
  if (historyIndex < history.length - 1) {
    history = history.slice(0, historyIndex + 1);
  }
  history.push(snap);
  if (history.length > HISTORY_MAX) history.shift();
  historyIndex = history.length - 1;
  updateUndoRedoButtons();
}
function undo() {
  if (historyIndex <= 0) { showStatus('没有更多可撤销'); return; }
  historyIndex--;
  restoreSnapshot();
  showStatus('已撤销');
}
function redo() {
  if (historyIndex >= history.length - 1) { showStatus('没有更多可重做'); return; }
  historyIndex++;
  restoreSnapshot();
  showStatus('已重做');
}
function restoreSnapshot() {
  const data = JSON.parse(history[historyIndex]);
  layers = data.layers;
  styles = data.styles;
  nextElementId = data.nextElementId;
  nextLayerId = data.nextLayerId;
  nextLayerSeq = data.nextLayerSeq;
  // 确保 activeLayerId 和 selectedId 有效
  if (!layers.find(l => l.id === activeLayerId)) activeLayerId = layers[0]?.id || null;
  if (!selectedId || !findElement(selectedId)) selectedId = null;
  renderAll();
  updateUndoRedoButtons();
}
function updateUndoRedoButtons() {
  const u = document.getElementById('btnUndo');
  const r = document.getElementById('btnRedo');
  if (u) u.style.opacity = historyIndex > 0 ? '1' : '0.35';
  if (r) r.style.opacity = historyIndex < history.length - 1 ? '1' : '0.35';
}
// 包装需要记录历史的函数
function recordHistory(fn) { snapshot(); fn(); }

/* ============ 网格 ============ */
function toggleGrid() {
  gridEnabled = !gridEnabled;
  const overlay = document.getElementById('gridOverlay');
  const btn = document.getElementById('btnGrid');
  if (overlay) overlay.style.display = gridEnabled ? 'block' : 'none';
  if (btn) btn.style.opacity = gridEnabled ? '1' : '0.5';
  // 动态调整网格线粗细（响应缩放）
  updateGridOverlay();
  showStatus(gridEnabled ? '对齐网格 开' : '对齐网格 关');
}
function updateGridOverlay() {
  const overlay = document.getElementById('gridOverlay');
  if (!overlay) return;
  const { w: sw, h: sh } = getScreen();
  const scale = stage.clientWidth / sw;
  const px = Math.max(6, Math.round(gridSizePx * scale));
  overlay.style.backgroundSize = px + 'px ' + px + 'px';
}
function snapToGrid(val) {
  if (!gridEnabled) return val;
  return Math.round(val / gridSizePx) * gridSizePx;
}
window._updateGridOverlay = updateGridOverlay;

/* ============ 工具 ============ */
function escapeHtml(s) { s = s == null ? '' : s; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }
function randomHex(len) { let out=''; for(let i=0;i<len;i++) out+='0123456789abcdef'[Math.floor(Math.random()*16)]; return out; }
function pctToTen(pct) { return Math.round(Math.max(0, Math.min(100, pct)) * 100); }
function tenToPct(ten) { return Math.round((ten / 100) * 10) / 10; } // 保留一位小数
function showStatus(msg) {
  const s = document.getElementById('status');
  s.textContent = msg; s.classList.add('show');
  clearTimeout(s._t); s._t = setTimeout(() => s.classList.remove('show'), 1800);
}
function getScreen() {
  return { w: Math.max(240, parseInt(screenWInput.value) || 2400), h: Math.max(480, parseInt(screenHInput.value) || 1080) };
}
function getActiveLayer() { return layers.find(l => l.id === activeLayerId) || layers[0] || null; }
function findElement(id) {
  for (const l of layers) { const e = l.elements.find(x => x.id === id); if (e) return { layer: l, element: e }; }
  return null;
}

/* ============ GLFW 键码 ============ */
const GLFW_KEYS = {
  'A':'GLFW_KEY_A','B':'GLFW_KEY_B','C':'GLFW_KEY_C','D':'GLFW_KEY_D','E':'GLFW_KEY_E',
  'F':'GLFW_KEY_F','G':'GLFW_KEY_G','H':'GLFW_KEY_H','I':'GLFW_KEY_I','J':'GLFW_KEY_J',
  'K':'GLFW_KEY_K','L':'GLFW_KEY_L','M':'GLFW_KEY_M','N':'GLFW_KEY_N','O':'GLFW_KEY_O',

/* ============ 画布尺寸 ============ */
function syncStageSize() {
  const wrap = stageWrap.getBoundingClientRect();
  const { w: sw, h: sh } = getScreen();
  let availW = wrap.width - 24;
  let availH = wrap.height - 36;
  // 容器尺寸异常时兜底用窗口
  if (availW < 60 || availH < 60) {
    availW = Math.max(availW, window.innerWidth - 32);
    availH = Math.max(availH, window.innerHeight * 0.45);
  }
  // 画布缩放：优先用用户滑块，否则自动填满
  const userScaleInput = document.getElementById('canvasScale');
  let scale;
  if (userScaleInput && userScaleInput.dataset.manual === '1') {
    scale = parseInt(userScaleInput.value) / 100;
  } else {
    scale = Math.min(availW / sw, availH / sh, 1);
    scale = Math.max(scale, 0.05);
    // 自动填入滑块（给用户一个初始值）
    if (userScaleInput) userScaleInput.value = Math.round(scale * 100);
  }
  stage.style.width = Math.round(sw * scale) + 'px';
  stage.style.height = Math.round(sh * scale) + 'px';
  const label = document.getElementById('scaleLabel');
  if (label) label.textContent = Math.round(scale * 100) + '%';
  // 网格跟随缩放
  if (typeof window._updateGridOverlay === 'function') window._updateGridOverlay();
  const layer = getActiveLayer();
  if (layer) layer.elements.forEach(el => positionNode(el));
  renderStageLabel();
  updateAllPanels();
}
// 画布缩放滑块事件
const canvasScaleInputEl = document.getElementById('canvasScale');
if (canvasScaleInputEl) {
  canvasScaleInputEl.addEventListener('input', () => {
    canvasScaleInputEl.dataset.manual = '1';  // 用户拖过 → 不再自动缩放
    syncStageSize();
  });
}
function setPreset(w, h) {
  snapshot();
  screenWInput.value = w; screenHInput.value = h;
  canvasScaleInputEl.dataset.manual = '0';
  syncStageSize(); showStatus('预设 ' + w + '×' + h);
}
function swapScreenXY() {
  const w = parseInt(screenWInput.value);
  const h = parseInt(screenHInput.value);
  snapshot();
  screenWInput.value = h; screenHInput.value = w;
  canvasScaleInputEl.dataset.manual = '0';
  syncStageSize(); showStatus('已切换横竖屏');
}
window.addEventListener('resize', syncStageSize);
screenWInput.addEventListener('change', () => { snapshot(); syncStageSize(); });
screenHInput.addEventListener('change', () => { snapshot(); syncStageSize(); });

function renderStageLabel() {
  const { w, h } = getScreen();

  const pre = layer ? `${layer.name} · ` : '';
  document.getElementById('stageLabel').textContent = `${pre}${w}×${h} · 拖拽移动`;
}

/* ============ 图层 ============ */
function createLayer(name, visibilityType) {
  return {
    id: nextLayerId++,
    name: name || ('控件层' + nextLayerSeq++),
    uuid: randomHex(12),
    hide: false, hideWhenMouse: false, hideWhenGamepad: false,
    visibilityType: visibilityType || 'always',
    elements: [],
  };
}
function addLayerUI() {
  snapshot();
  const layer = createLayer('控件层' + nextLayerSeq++, 'always');
  layers.unshift(layer);
  activeLayerId = layer.id; selectedId = null;
  renderAll(); showStatus('已新建图层');
}
function setActiveLayer(id) {
  if (activeLayerId === id) return;
  activeLayerId = id;
  const f = selectedId ? findElement(selectedId) : null;
  if (!f || f.layer.id !== id) selectedId = null;
  renderAll();
}
function moveLayer(id, dir) {
  const i = layers.findIndex(l => l.id === id);
  if (i < 0) return;
  const ni = i + dir;
  if (ni < 0 || ni >= layers.length) return;
  [layers[i], layers[ni]] = [layers[ni], layers[i]];
  renderAll();
}
function deleteLayer(id) {
  if (layers.length <= 1) { showStatus('至少保留一个图层'); return; }
  const i = layers.findIndex(l => l.id === id);
  if (i < 0) return;
  snapshot();
  layers.splice(i, 1);
  if (activeLayerId === id) { activeLayerId = layers[Math.min(i, layers.length - 1)].id; }
  if (selectedId && !findElement(selectedId)) selectedId = null;
  renderAll(); showStatus('已删除图层');
}
function renderLayerPanel() {
  const panel = document.getElementById('layerPanel');
  if (!panel) return;
  panel.innerHTML = '';
  layers.forEach(layer => {
    const row = document.createElement('div');
    row.className = 'layer-row' + (layer.id === activeLayerId ? ' active' : '') + (layer.hide ? ' hidden-layer' : '');
    row.innerHTML = `
      <span class="layer-eye">${layer.hide ? '🚫' : '👁'}</span>
      <span class="layer-name">${escapeHtml(layer.name)} <span style="color:#5a5a68;font-size:10px">(${layer.elements.length})</span></span>
      <span class="layer-actions">
        <button title="上移">↑</button>
        <button title="下移">↓</button>
        <button title="删除">✕</button>
      </span>`;
    row.onclick = () => setActiveLayer(layer.id);
    row.querySelector('.layer-eye').onclick = e => { e.stopPropagation(); layer.hide = !layer.hide; renderAll(); };
    const b = row.querySelectorAll('.layer-actions button');
    b[0].onclick = e => { e.stopPropagation(); moveLayer(layer.id, -1); };
    b[1].onclick = e => { e.stopPropagation(); moveLayer(layer.id, 1); };
    b[2].onclick = e => { e.stopPropagation(); deleteLayer(layer.id); };
    panel.appendChild(row);
  });
}

/* ============ 元素 ============ */
function createElementData(type) {
  const { w: sw, h: sh } = getScreen();
  // ⚠️ 坐标单位 = 屏幕像素（不是万分比！）
  const base = {
    id: nextElementId++,
    elementType: type,
    uuid: randomHex(16),
    x: Math.round(sw * 0.5),
    y: Math.round(sh * 0.5),
    w: Math.round(sw * 0.125),
    h: Math.round(sh * 0.2),
    sizeType: 'percentage',
    buttonStyle: '',
    // 启动器事件字段
    slideTrigger: false, moveMouse: false, showLayers: false,
  };
  if (type === 'normal') return { ...base, text: '按键', keycodes: ['GLFW_KEY_SPACE'], toggleable: false };
  if (type === 'textbox') return { ...base, text: '文字', sizeType: 'wrap_content', textAlign: 'center', bold: false, italic: false, underline: false };
  return base;
}
function addElement(type) { addElementToActiveLayer(createElementData(type)); }
function addElementToActiveLayer(el) {
  const layer = getActiveLayer();
  if (!layer) { showStatus('请先创建图层'); return; }
  snapshot();
  // 加个小偏移，避免多个按钮完全重叠
  el.x = Math.max(50, el.x + Math.floor(Math.random() * 120 - 60));
  el.y = Math.max(50, el.y + Math.floor(Math.random() * 120 - 60));
  layer.elements.push(el);
  selectedId = el.id;
  renderAll();
}
function deleteElement(id) {
  const f = findElement(id); if (!f) return;
  snapshot();
  f.layer.elements = f.layer.elements.filter(el => el.id !== id);
  if (selectedId === id) selectedId = null;
  renderAll(); showStatus('已删除 (Ctrl+Z 撤销)');
}
function duplicateElement(id) {
  const f = findElement(id); if (!f) return;
  const { w: sw, h: sh } = getScreen();
  const src = f.element;
  const dup = JSON.parse(JSON.stringify(src));
  dup.id = nextElementId++; dup.uuid = randomHex(16);
  dup.x = Math.min(sw - 100, dup.x + 120);
  dup.y = Math.min(sh - 100, dup.y + 120);
  snapshot();
  f.layer.elements.push(dup);
  selectedId = dup.id;
  renderAll(); showStatus('已复制 (Ctrl+D)');
}

/* ============ 数据自动修复：把超出屏幕的坐标拉回来 ============ */
function fixOutOfBoundsElements() {
  const { w: sw, h: sh } = getScreen();
  let fixed = 0;
  layers.forEach(l => {
    l.elements.forEach(el => {
      const was = { x: el.x, y: el.y, w: el.w, h: el.h };
      // 如果 x/y 超出屏幕 3 倍以上，说明用了万分比单位，自动转换
      if (el.x > sw * 2 || el.y > sh * 2) {
        const newX = Math.round(el.x / 10000 * sw);  // 万分比 → 像素
        const newY = Math.round(el.y / 10000 * sh);
        if (newX > 0 && newX < sw && newY > 0 && newY < sh) {
          el.x = newX; el.y = newY; fixed++;
        } else {
          el.x = Math.round(sw * 0.5); el.y = Math.round(sh * 0.5); fixed++;
        }
      }
      if (el.w > sw * 2 || el.h > sh * 2) {
        el.w = Math.round(sw * 0.125); el.h = Math.round(sh * 0.2); fixed++;
      }
      // clamp
      el.x = Math.max(20, Math.min(sw - 20, el.x));
      el.y = Math.max(20, Math.min(sh - 20, el.y));
    });
  });
  if (fixed > 0) showStatus(`自动修正了 ${fixed} 个控件位置`);
}

/* ============ 画布渲染 ============ */
function renderAll() { renderLayerPanel(); renderStage(); renderInspector(); }

function renderStage() {
  stage.innerHTML = '';
  const layer = getActiveLayer();
  if (!layer) return;
  layer.elements.forEach(el => {
    if (layer.hide) return; // 整个图层隐藏则跳过
    const dom = document.createElement('div');
    dom.className = 'element-node ' + el.elementType
      + (el.id === selectedId ? ' selected' : '')
      + (el.elementType === 'normal' && el.toggleable ? ' toggleable' : '')
      + ' default-style';
    dom.dataset.id = el.id;

    if (el.elementType === 'joystick') {
      dom.innerHTML = `<div class="joystick-base"><div class="joystick-stick"></div></div>`;
    } else {
      dom.textContent = el.text;
      // textbox 富文本样式
      if (el.elementType === 'textbox') {
        if (el.textAlign) dom.style.textAlign = el.textAlign;
        if (el.bold) dom.style.fontWeight = 'bold';
        if (el.italic) dom.style.fontStyle = 'italic';
        if (el.underline) dom.style.textDecoration = 'underline';
      }
      const s = styles.find(x => x.uuid === el.buttonStyle);
      if (s && s.darkStyle) {
        const th = s.darkStyle;
        const u = th.backgroundColor >>> 0;
        const a = ((u >>> 24) & 0xFF) / 255 * th.alpha;
        dom.style.backgroundColor = `rgba(${(u>>>16)&0xFF},${(u>>>8)&0xFF},${u&0xFF},${a})`;
        const cu = th.contentColor >>> 0;
        dom.style.color = `rgba(${(cu>>>16)&0xFF},${(cu>>>8)&0xFF},${cu&0xFF},${((cu>>>24)&0xFF)/255})`;
        const r = th.borderRadius.topStart;
        dom.style.borderRadius = (r * stage.clientHeight / 1080) + 'px';
        dom.classList.remove('default-style');
      }
    }

    dom.addEventListener('mousedown', e => startDrag(e, el.id), { passive: false });
    dom.addEventListener('touchstart', e => startDrag(e, el.id), { passive: false });
    stage.appendChild(dom);
    positionNode(el);
  });
  // 选中元素加坐标标签
  if (selectedId) {
    const f = findElement(selectedId);
    if (f) {
      const dom = stage.querySelector(`[data-id="${selectedId}"]`);
      if (dom) {
        const badge = document.createElement('div');
        badge.className = 'coord-badge';
        const { w: sw, h: sh } = getScreen();
        const xp = (f.element.x / sw * 100).toFixed(1);
        const yp = (f.element.y / sh * 100).toFixed(1);
        badge.textContent = `${xp}%, ${yp}%`;
        badge.style.left = dom.style.left;
        badge.style.top = dom.style.top;
        stage.appendChild(badge);
      }
    }
  }
  renderStageLabel();
}

function positionNode(el) {
  const dom = stage.querySelector(`[data-id="${el.id}"]`);
  if (!dom) return;
  const { w: sw, h: sh } = getScreen();
  const scaleX = stage.clientWidth / sw;
  const scaleY = stage.clientHeight / sh;
  dom.style.left = (el.x * scaleX) + 'px';
  dom.style.top = (el.y * scaleY) + 'px';

  if (el.elementType === 'joystick') {
    const js = 1562 * scaleY;
    dom.style.width = js + 'px'; dom.style.height = js + 'px';
  } else {
    dom.style.padding = '2px';
    if (el.sizeType === 'wrap_content') {
      dom.style.width = 'auto'; dom.style.height = 'auto';
      dom.style.padding = '4px 8px'; dom.style.fontSize = '12px';
    } else {
      let wPx, hPx;
      if (el.sizeType === 'dp') {
        wPx = el.wDp * (stage.clientHeight / 320);
        hPx = el.hDp * (stage.clientHeight / 320);
      } else {
        wPx = el.w * scaleY; hPx = el.h * scaleY;
      }
      dom.style.width = Math.max(8, wPx) + 'px';
      dom.style.height = Math.max(8, hPx) + 'px';
      dom.style.fontSize = Math.max(8, Math.min(16, wPx * 0.22)) + 'px';
    }
  }
}

/* ============ 拖拽（pointer events 统一 mouse + touch + pen） ============ */
let dragState = null;

function getEventPoint(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function startDrag(e, id) {
  e.preventDefault();
  const f = findElement(id); if (!f) return;
  selectElement(id);
  const dom = stage.querySelector(`[data-id="${id}"]`); if (!dom) return;
  // 提升 z-index 避免被同级遮挡
  dom.style.zIndex = '999';
  const p = getEventPoint(e);
  const rect = dom.getBoundingClientRect();
  dragState = { id, offsetX: p.x - rect.left, offsetY: p.y - rect.top };

  // pointer events 一次搞定所有设备
  try { dom.setPointerCapture?.(e.pointerId); } catch(_) {}
  document.addEventListener('pointermove', onDrag, { passive: false });
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
}
// 画布空白处点击 → 取消选中
stage.addEventListener('pointerdown', function(e) {
  if (e.target === stage || e.target.classList.contains('grid-overlay')) {
    if (selectedId) { selectedId = null; renderAll(); }
  }
});

function onDrag(e) {
  if (!dragState) return;
  e.preventDefault();
  const f = findElement(dragState.id); if (!f) return;
  const el = f.element;
  const stageRect = stage.getBoundingClientRect();
  const { w: sw, h: sh } = getScreen();
  const scaleX = stage.clientWidth / sw;
  const scaleY = stage.clientHeight / sh;
  const p = getEventPoint(e);
  let px = p.x - stageRect.left - dragState.offsetX;
  let py = p.y - stageRect.top - dragState.offsetY;

  let domW = 0, domH = 0;
  if (el.elementType === 'joystick') { domW = 1562 * scaleY; domH = 1562 * scaleY; }
  else {
    const dom = stage.querySelector(`[data-id="${el.id}"]`);
    if (dom) { domW = dom.offsetWidth; domH = dom.offsetHeight; }
  }
  px = Math.max(0, Math.min(stage.clientWidth - domW, px));
  py = Math.max(0, Math.min(stage.clientHeight - domH, py));

  let newX = Math.round(px / scaleX);
  let newY = Math.round(py / scaleY);
  // 网格对齐
  if (gridEnabled) {
    newX = snapToGrid(newX);
    newY = snapToGrid(newY);
  }
  el.x = newX;
  el.y = newY;
  positionNode(el);

  // 实时更新右侧面板 + 坐标标签
  updateSelectedBadge(el);
  // 同步属性面板数值
  const xp = document.getElementById('propXpct');
  const yp = document.getElementById('propYpct');
  if (xp) { const v = (el.x / sw * 100).toFixed(1); xp.value = v; const r = document.getElementById('propXrange'); if (r) r.value = v; }
  if (yp) { const v = (el.y / sh * 100).toFixed(1); yp.value = v; const r = document.getElementById('propYrange'); if (r) r.value = v; }
}

function endDrag() {
  if (dragState) {
    try { stage.querySelector(`[data-id="${dragState.id}"]`).style.zIndex = ''; } catch(_) {}
    snapshot();
  }
  dragState = null;
  document.removeEventListener('pointermove', onDrag);
  document.removeEventListener('pointerup', endDrag);
  document.removeEventListener('pointercancel', endDrag);
  renderStage();
  renderInspector();
}

function updateSelectedBadge(el) {
  const badge = stage.querySelector('.coord-badge');
  if (badge) {
    const { w: sw, h: sh } = getScreen();
    const xp = (el.x / sw * 100).toFixed(1);
    const yp = (el.y / sh * 100).toFixed(1);
    badge.textContent = `${xp}%, ${yp}%`;
    badge.style.left = stage.querySelector(`[data-id="${el.id}"]`)?.style.left || '0';
    badge.style.top = stage.querySelector(`[data-id="${el.id}"]`)?.style.top || '0';
  }
}

/* ============ 选中 ============ */
function selectElement(id) {
  selectedId = id;
  renderStage();
  // 同步更新所有面板
  updateAllPanels();
}

/* ============ 键盘快捷键 ============ */
document.addEventListener('keydown', e => {
  // 输入框里别触发（但 Ctrl+Z 撤销始终允许）
  const tag = (e.target.tagName || '').toLowerCase();
  const isEdit = (e.target.contentEditable === 'true') || tag === 'input' || tag === 'textarea';

  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
    e.preventDefault(); undo();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    e.preventDefault(); redo();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'z') {
    e.preventDefault(); redo();
    return;
  }
  if (isEdit) return;

  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) {
    e.preventDefault();
    deleteElement(selectedId);
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd' && selectedId) {
    e.preventDefault();
    duplicateElement(selectedId);
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
    const layer = getActiveLayer();
    if (layer && layer.elements.length) { e.preventDefault(); selectElement(layer.elements[0].id); }
  } else if (e.key === 'g' || e.key === 'G') {
    e.preventDefault(); toggleGrid();
  }
});

// 渲染多按键 chip（从 keycodes 数组，兼容旧 keyName 单字段）
function renderKeyChipsHTML(el) {
  const codes = el.keycodes && el.keycodes.length ? el.keycodes : (el.keyName ? [el.keyName] : []);
  // code → 友好 label 反查
  const codeToLabel = {};
  Object.entries(ALL_KEYS).forEach(([label, code]) => codeToLabel[code] = label);
  return codes.map((code, idx) => {

    return `<span class="keychip">${escapeHtml(label)}<span class="remove" onclick="removeKeycode(${el.id}, ${idx})" title="移除">×</span></span>`;

// chip 对应的搜索下拉（支持实时过滤 + 自定义输入 chat:/xxx）
function keyAddSelectHTML(el) {
  return `
    <div class="key-search" style="position:relative;margin-top:6px">

function showKeyList(elId, input) {
  filterKeyList(elId, input.value || '');
  // 点击外部关闭
  setTimeout(() => {
    const dd = document.getElementById('keyListDropdown');
    if (!dd) return;
    const close = (e) => {
      if (!dd.contains(e.target) && e.target !== input) {
        dd.style.display = 'none';
        document.removeEventListener('click', close, true);
      }
    };
    document.addEventListener('click', close, true);
  }, 10);
}
function filterKeyList(elId, q) {
  const dd = document.getElementById('keyListDropdown');
  if (!dd) return;
  dd.style.display = 'block';
  const ql = (q || '').toLowerCase();
  const groups = [
    { name: '⌨ 键盘', map: GLFW_KEYS },
    { name: '🖱 鼠标', map: GLFW_MOUSE },
    { name: '💬 Minecraft 命令', map: CHAT_COMMANDS },
  ];
  let html = '';
  let shown = 0;
  groups.forEach(g => {
    const items = Object.entries(g.map).filter(([label, code]) => {
      if (!ql) return true;
      return label.toLowerCase().includes(ql) || code.toLowerCase().includes(ql);
    });
    if (!items.length) return;
    html += `<div style="padding:4px 8px;font-size:10px;color:#5a5a68;border-top:1px solid #2e2e3a">${g.name}</div>`;
    items.slice(0, 30).forEach(([label, code]) => {
      html += `<div class="kli" style="padding:5px 8px;cursor:pointer;font-size:12px;color:#c8c8d4;display:flex;justify-content:space-between" data-code="${code}" data-label="${label}">
        <span>${label}</span><span style="color:#5a5a68;font-size:10px;font-family:monospace">${code}</span></div>`;
      shown++;
    });
  });
  if (!shown) {
    // 完全没匹配，把输入内容当作 chat: 命令直接加
    if (ql.startsWith('chat:') || ql.startsWith('/')) {
      html = `<div class="kli" style="padding:8px;cursor:pointer;background:#4a6cf7;color:#fff" data-code="${ql.startsWith('chat:') ? ql : 'chat:' + ql}" data-label="自定义: ${ql}">✚ 作为聊天命令添加 "chat:${ql}"</div>`;
    } else {
      html = `<div style="padding:8px;color:#5a5a68;font-size:11px;text-align:center">未匹配。试试完整输入 chat:/say 或 GLFW_KEY_xxx</div>`;
    }
  }
  dd.innerHTML = html;
  dd.querySelectorAll('.kli').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const code = item.dataset.code;
      addKeycode(elId, code);
      dd.style.display = 'none';
    });
    item.addEventListener('mouseenter', () => item.style.background = '#2a2a38');
    item.addEventListener('mouseleave', () => item.style.background = '');
  });
}
function removeKeycode(elId, idx) {
  const f = findElement(elId); if (!f) return;
  const el = f.element;
  const arr = el.keycodes && el.keycodes.length ? [...el.keycodes] : (el.keyName ? [el.keyName] : []);
  arr.splice(idx, 1);
  el.keycodes = arr;
  if (arr.length) el.keyName = arr[0]; else delete el.keyName;
  snapshot();
  renderAll();
}
function addKeycode(elId, code) {
  if (!code) return;
  const f = findElement(elId); if (!f) return;
  const el = f.element;
  if (!el.keycodes || !el.keycodes.length) el.keycodes = el.keyName ? [el.keyName] : [];
  if (el.keycodes.includes(code)) { showStatus('已存在'); return; }
  el.keycodes.push(code);
  el.keyName = el.keycodes[0];
  snapshot();
  renderAll();
}

function bindInspectorEvents() {
  const f = selectedId ? findElement(selectedId) : null;
  const el = f?.element;

  // range + number 双向联动辅助
  function bindPctPair(id, onChange) {
    const num = document.getElementById(id);
    const rng = document.getElementById(id + 'range');
    if (!num || !rng) return;
    let skip = false;
    const sync = (source) => {
      if (skip) return;
      skip = true;
      rng.value = source.value; num.value = source.value;
      skip = false;
      onChange(parseFloat(source.value));
    };
    num.oninput = e => sync(num);
    rng.oninput = e => sync(rng);
  }

  // 元素属性
  if (el) {
    const t = document.getElementById('propText');
    if (t) t.oninput = e => { el.text = e.target.value; renderStage(); };

    const tg = document.getElementById('propToggle');
    if (tg) tg.onchange = e => { el.toggleable = e.target.checked; renderStage(); snapshot(); };
    const st = document.getElementById('propSlideTrigger');
    if (st) st.onchange = e => { el.slideTrigger = e.target.checked; snapshot(); };
    const mm = document.getElementById('propMoveMouse');
    if (mm) mm.onchange = e => { el.moveMouse = e.target.checked; snapshot(); };
    const sl = document.getElementById('propShowLayers');
    if (sl) sl.onchange = e => { el.showLayers = e.target.checked; snapshot(); };

    // textbox 富文本
    const bold = document.getElementById('propBold');
    const italic = document.getElementById('propItalic');
    const undl = document.getElementById('propUnderline');
    if (bold) bold.onchange = e => { el.bold = e.target.checked; snapshot(); renderStage(); };
    if (italic) italic.onchange = e => { el.italic = e.target.checked; snapshot(); renderStage(); };
    if (undl) undl.onchange = e => { el.underline = e.target.checked; snapshot(); renderStage(); };
    const applyAlign = dir => { el.textAlign = dir; snapshot(); renderAll(); };
    const aL = document.getElementById('propAlignLeft'), aC = document.getElementById('propAlignCenter'), aR = document.getElementById('propAlignRight');
    if (aL) aL.onclick = () => applyAlign('left');
    if (aC) aC.onclick = () => applyAlign('center');
    if (aR) aR.onclick = () => applyAlign('right');

    const { w: sw, h: sh } = getScreen();
    bindPctPair('propXpct', v => {
      el.x = snapToGrid(Math.round(v / 100 * sw));
      positionNode(el); updateSelectedBadge(el);
    });
    bindPctPair('propYpct', v => {
      el.y = snapToGrid(Math.round(v / 100 * sh));
      positionNode(el); updateSelectedBadge(el);
    });
    bindPctPair('propWpct', v => {
      el.sizeType = 'percentage';
      el.w = Math.max(20, Math.round(v / 100 * sw));
      positionNode(el);
    });
    bindPctPair('propHpct', v => {
      el.sizeType = 'percentage';
      el.h = Math.max(20, Math.round(v / 100 * sh));
      positionNode(el);
    });

    const wrap = document.getElementById('propWrap');
    if (wrap) wrap.onchange = e => {
      el.sizeType = e.target.checked ? 'wrap_content' : 'percentage';
      snapshot();
      renderInspector(); renderStage();
    };
    return;
  }

  // 图层属性
  const layer = getActiveLayer();
  if (!layer) return;
  const ln = document.getElementById('layerName');
  if (ln) ln.oninput = e => { layer.name = e.target.value; renderLayerPanel(); renderStageLabel(); };
  const lv = document.getElementById('layerVis');
  if (lv) lv.onchange = e => { layer.visibilityType = e.target.value; snapshot(); };
  const lh = document.getElementById('layerHide');
  if (lh) lh.onchange = e => { snapshot(); layer.hide = e.target.checked; renderAll(); };
  const lhwm = document.getElementById('layerHideWhenMouse');
  if (lhwm) lhwm.onchange = e => { layer.hideWhenMouse = e.target.checked; snapshot(); };
  const lhwg = document.getElementById('layerHideWhenGamepad');
  if (lhwg) lhwg.onchange = e => { layer.hideWhenGamepad = e.target.checked; };
}

/* ============ 导出 / 导入 JSON（Zalith2 真实格式） ============ */
// 万分比换算：position x/y 相对宽/高；buttonSize 百分比统一相对 screen_height
function makeTextObj(s) { return { default: s || '', matchQueue: [] }; }
function makeSizeObj(el, sh) {
  return {
    type: el.sizeType || 'percentage',
    widthDp: el.wDp || 50.0,
    heightDp: el.hDp || 50.0,
    widthPercentage: Math.round((el.w || 0) / sh * 10000),
    heightPercentage: Math.round((el.h || 0) / sh * 10000),
    widthReference: 'screen_height',
    heightReference: 'screen_height'
  };
}
// 样式主题 → Zalith 完整结构（缺省值对齐官方模板）
function makeThemeObj(t) {
  if (!t) t = {};
  const br = t.borderRadius || { topStart: 0, topEnd: 0, bottomEnd: 0, bottomStart: 0 };
  const base = {
    alpha: t.alpha ?? 1.0,
    pressedAlpha: t.pressedAlpha ?? 1.0,
    backgroundColor: t.backgroundColor ?? 2147483648,
    pressedBackgroundColor: t.pressedBackgroundColor ?? 3012069512,
    contentColor: t.contentColor ?? 4294967295,
    pressedContentColor: t.pressedContentColor ?? 4294967295,
    borderWidth: t.borderWidth ?? 0,
    pressedBorderWidth: t.pressedBorderWidth ?? 0,
    borderColor: t.borderColor ?? 4294967295,
    pressedBorderColor: t.pressedBorderColor ?? 4294967295,
    borderRadius: { topStart: br.topStart || 0, topEnd: br.topEnd || 0, bottomEnd: br.bottomEnd || 0, bottomStart: br.bottomStart || 0 },
    pressedBorderRadius: { topStart: 0, topEnd: 0, bottomEnd: 0, bottomStart: 0 }
  };
  return base;
}
function exportJSON() {
  const { w: sw, h: sh } = getScreen();

  const outLayers = layers.map(l => {
    const layer = {
      name: l.name, uuid: l.uuid, hide: !!l.hide,
      visibilityType: l.visibilityType || 'always'
    };
    if (l.hideWhenMouse || l.hideWhenGamepad) {
      layer.hideWhenMouse = !!l.hideWhenMouse;
      layer.hideWhenGamepad = !!l.hideWhenGamepad;
    }
    const normals = [], boxes = [], joys = [];
    l.elements.forEach(el => {
      const pos = { x: Math.round(el.x / sw * 10000), y: Math.round(el.y / sh * 10000) };
      if (el.elementType === 'joystick') {
        joys.push({ uuid: el.uuid, position: pos });
        return;
      }
      const o = {
        text: makeTextObj(el.text),
        uuid: el.uuid,
        position: pos,
        buttonSize: makeSizeObj(el, sh),
        visibilityType: 'always'
      };
      if (el.buttonStyle) o.buttonStyle = el.buttonStyle;
      if (el.elementType === 'textbox') {
        boxes.push(o);
      } else {
        o.isSwipple = !!el.slideTrigger;
        o.isPenetrable = !!el.moveMouse;
        o.isToggleable = !!el.toggleable;
        const codes = (el.keycodes && el.keycodes.length) ? el.keycodes : (el.keyName ? [el.keyName] : []);
        if (codes.length) o.keycodes = codes;
        normals.push(o);
      }
    });
    if (normals.length) layer.normalButtons = normals;
    if (boxes.length) layer.textBoxes = boxes;
    if (joys.length) layer.joystickButtons = joys;
    return layer;
  });

  const output = {
    info: {
      name: makeTextObj('我的键位'),
      author: makeTextObj('editor'),
      description: makeTextObj(''),
      versionCode: 0,
      versionName: '1.0'
    },
    layers: outLayers,
    styles: styles.map(s => ({
      name: s.name, uuid: s.uuid, animateSwap: !!s.animateSwap,
      lightStyle: makeThemeObj(s.lightStyle),
      darkStyle: makeThemeObj(s.darkStyle)
    })),
    editorVersion: 12
  };

  // ===== 直接下载 =====
  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const ts = new Date().toISOString().slice(0, 10);
  const fname = `zalith-layout-${ts}.json`;
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showStatus('✓ 已下载 ' + fname);
  } catch (e) {
    // 兜底：不支持下载时打开预览模态
    document.getElementById('jsonTitle').textContent = '导出（浏览器阻止了自动下载）';
    document.getElementById('jsonArea').value = JSON.stringify(output, null, 2);
    document.getElementById('jsonActionBtn').textContent = '复制';
    document.getElementById('jsonActionBtn').onclick = copyJSON;
    document.getElementById('jsonOverlay').classList.add('show');
  }
}
function closeJSON() { document.getElementById('jsonOverlay').classList.remove('show'); }
function copyJSON() {
  const ta = document.getElementById('jsonArea');
  ta.select();
  try { navigator.clipboard.writeText(ta.value).then(() => showStatus('已复制')); }
  catch (e) { document.execCommand('copy'); showStatus('已复制'); }
}
function showImport() {
  document.getElementById('jsonTitle').textContent = '导入 JSON（粘贴后点下方导入）';
  document.getElementById('jsonArea').value = '';
  document.getElementById('jsonActionBtn').textContent = '导入';
  document.getElementById('jsonActionBtn').onclick = doImport;
  document.getElementById('jsonOverlay').classList.add('show');
}
function doImport() {
  try { snapshot(); importJSON(JSON.parse(document.getElementById('jsonArea').value)); closeJSON(); showStatus('导入成功'); }
  catch (e) { showStatus('导入失败：' + e.message); }
}
function importJSON(data) {
  layers = []; styles = [];
  activeLayerId = null; selectedId = null;
  nextElementId = 1; nextLayerId = 1; nextLayerSeq = 1;

  // Zalith2 格式：顶层 info / layers / styles / editorVersion
  // screen 尺寸从 editor 设置读取（模板里没有 screen 字段）
  const sw = parseInt(screenWInput.value) || 2400;
  const sh = parseInt(screenHInput.value) || 1080;

  // 万分比 → 像素
  const pos2px = (p, ref) => Math.round((p || 0) / 10000 * ref);
  const pct2pxH = (v) => Math.round((v || 0) / 10000 * sh);  // 尺寸参照 screen_height

  if (Array.isArray(data.styles)) {
    data.styles.forEach(s => {
      const ns = createStyle(s.name);
      ns.uuid = s.uuid || randomHex(12);
      ns.animateSwap = !!s.animateSwap;
      if (s.lightStyle) ns.lightStyle = { ...createDefaultTheme(), ...s.lightStyle };
      if (s.darkStyle) ns.darkStyle = { ...createDefaultTheme(), ...s.darkStyle };
      styles.push(ns);
    });
  }
  if (Array.isArray(data.layers)) {
    data.layers.forEach(l => {
      const layer = createLayer(typeof l.name === 'object' ? (l.name?.default || '控件层') : (l.name || '控件层'), l.visibilityType || 'always');
      layer.id = nextLayerId++;
      layer.uuid = l.uuid || randomHex(12);
      layer.hide = !!l.hide;
      layer.hideWhenMouse = !!l.hideWhenMouse;
      layer.hideWhenGamepad = !!l.hideWhenGamepad;

      // 按类型分组解析
      const parseCommon = (el, e) => {
        el.uuid = e.uuid || randomHex(16);
        el.x = pos2px(e.position?.x, sw);
        el.y = pos2px(e.position?.y, sh);
        const bs = e.buttonSize || {};
        el.sizeType = bs.type || 'percentage';
        el.w = pct2pxH(bs.widthPercentage);
        el.h = pct2pxH(bs.heightPercentage);
        if (bs.widthDp) el.wDp = bs.widthDp;
        if (bs.heightDp) el.hDp = bs.heightDp;
        if (e.buttonStyle) el.buttonStyle = e.buttonStyle;
        if (el.w < 20) { el.w = Math.round(sw * 0.125); }
        if (el.h < 20) { el.h = Math.round(sh * 0.2); }
      };

      (l.normalButtons || []).forEach(e => {
        const el = createElementData('normal');
        parseCommon(el, e);
        el.text = (typeof e.text === 'object' ? e.text?.default : e.text) || '按键';
        if (Array.isArray(e.keycodes) && e.keycodes.length) {
          el.keycodes = e.keycodes; el.keyName = e.keycodes[0];
        } else if (e.keyName) {
          el.keyName = e.keyName; el.keycodes = [e.keyName];
        } else {
          el.keycodes = []; el.keyName = '';
        }
        el.toggleable = !!e.isToggleable;
        el.slideTrigger = !!e.isSwipple;
        el.moveMouse = !!e.isPenetrable;
        layer.elements.push(el);
        if (el.id >= nextElementId) nextElementId = el.id + 1;
      });
      (l.textBoxes || []).forEach(e => {
        const el = createElementData('textbox');
        parseCommon(el, e);
        el.text = (typeof e.text === 'object' ? e.text?.default : e.text) || '文字';
        if (e.textAlign) el.textAlign = e.textAlign;
        if (e.bold) el.bold = true;
        if (e.italic) el.italic = true;
        if (e.underline) el.underline = true;
        layer.elements.push(el);
        if (el.id >= nextElementId) nextElementId = el.id + 1;
      });
      (l.joystickButtons || []).forEach(e => {
        const el = createElementData('joystick');
        parseCommon(el, e);
        layer.elements.push(el);
        if (el.id >= nextElementId) nextElementId = el.id + 1;
      });

      if (layer.id >= nextLayerId) nextLayerId = layer.id + 1;
      layers.push(layer);
    });
    activeLayerId = layers[0]?.id || null;
  }
  fixOutOfBoundsElements();
  renderAll(); syncStageSize();
}

/* ============ 样式管理（保留逻辑，不再暴露） ============ */
function createDefaultTheme() {
  return {
    alpha: 1.0, pressedAlpha: 1.0,
    backgroundColor: 2147483648, pressedBackgroundColor: 3012069512,
    contentColor: 4294967295, pressedContentColor: 4294967295,
    pressedFontSize: 14, borderWidth: 0, pressedBorderWidth: 0,
    borderColor: 4294967295, pressedBorderColor: 4294967295,
    borderRadius: { topStart: 0.0, topEnd: 0.0, bottomEnd: 0.0, bottomStart: 0.0 },
    pressedBorderRadius: { topStart: 0.0, topEnd: 0.0, bottomEnd: 0.0, bottomStart: 0.0 }
  };
}
function createStyle(name) {
  return {
    id: nextElementId++, name: name || '新样式',
    uuid: randomHex(12), animateSwap: false,
    lightStyle: createDefaultTheme(), darkStyle: createDefaultTheme()
  };
}

/* ============ Panels 同步 ============ */
function updateAllPanels() {
  if (window.innerWidth <= 720) {
    // 移动端：根据当前 tab 决定哪个面板 active
    switchMobileTab(currentMobileTab);
  } else {
    document.getElementById('panelLeft').classList.add('active');
    document.getElementById('panelRight').classList.add('active');
  }
}

/* ============ 初始化 ============ */
(function init() {
  // 自动选分辨率预设（看当前视口方向）
  const iw = window.innerWidth, ih = window.innerHeight;
  let autoW = 2400, autoH = 1080;  // 默认 2K 横屏
  if (iw <= 720) {
    // 手机
    if (iw > ih) { autoW = 2400; autoH = 1080; }  // 横屏 → 2K
    else { autoW = 1080; autoH = 1920; }           // 竖屏
  } else if (iw <= 1280 && iw > ih) {
    autoW = 1920; autoH = 1080;
  }
  // 只有用户没改过时才用自动预设
  screenWInput.value = autoW; screenHInput.value = autoH;

  // 默认图层
  const dl = createLayer('主控件层', 'always');
  layers.push(dl); activeLayerId = dl.id; nextLayerSeq = 2;

  // 桌面端显示左侧（图层+键位库）和右侧（属性），移动端由 tab 控制
  if (window.innerWidth <= 720) {
    document.getElementById('keyChips2').style.display = 'none';
    switchMobileTab('props');
    document.querySelector('.mobile-tabs .mtab:nth-child(2)').classList.add('active');
  }

  renderKeyChips();
  fixOutOfBoundsElements();  // 自动修正可能存在的旧版万分比坐标
  syncStageSize();
  renderAll();

  window.addEventListener('resize', () => {
    if (window.innerWidth <= 720) {
      if (!document.querySelector('.mobile-tabs .mtab.active')) {
        switchMobileTab('props');
      }
    }
  });

  showStatus('欢迎使用 — 拖动画布上的按钮，或按 Delete 删除');
})();
</script>
